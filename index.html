<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VencePronto Pro</title>
    <script src="https://unpkg.com"></script>
    <script src="https://tailwindcss.com"></script>
    <style>
        body { -webkit-tap-highlight-color: transparent; }
        #video { width: 100%; border-radius: 1rem; background: #000; }
        .status-red { border-left: 8px solid #ef4444; }
        .status-yellow { border-left: 8px solid #f59e0b; }
        .selected-cat { border: 3px solid #3b82f6 !important; background-color: #eff6ff !important; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen pb-24">

    <nav class="bg-blue-600 text-white p-4 sticky top-0 z-50 shadow-md">
        <h1 class="text-xl font-bold text-center">🍎 VencePronto Pro</h1>
    </nav>

    <main class="p-4 max-w-md mx-auto">
        <!-- VISTA SCANNER -->
        <div id="view-scan" class="block space-y-4">
            <div class="bg-white p-4 rounded-2xl shadow-sm">
                <video id="video"></video>
                <div class="mt-4">
                    <p class="text-xs font-bold text-gray-400 mb-1">CÓDIGO:</p>
                    <input type="text" id="barcode-input" class="w-full p-3 bg-gray-100 rounded-lg text-lg font-bold" placeholder="Escaneando...">
                </div>
            </div>

            <div class="bg-white p-4 rounded-2xl shadow-sm space-y-4">
                <input type="text" id="product-name" class="w-full p-3 border rounded-lg" placeholder="Nombre del producto">
                <div class="grid grid-cols-3 gap-2" id="categories-grid"></div>
                <input type="date" id="expiry-date" class="w-full p-3 border rounded-lg text-lg">
                <button onclick="saveProduct()" class="w-full bg-green-500 text-white font-bold py-4 rounded-xl shadow-lg">GUARDAR PRODUCTO</button>
            </div>
        </div>

        <!-- VISTA LISTA -->
        <div id="view-list" class="hidden space-y-4">
            <div class="flex justify-between items-center">
                <h2 class="text-lg font-bold text-gray-700">Inventario</h2>
                <button onclick="shareWhatsApp()" class="bg-green-500 text-white px-4 py-2 rounded-full text-sm font-bold">📢 Ofertas</button>
            </div>
            <div id="inventory-list" class="space-y-3"></div>
        </div>
    </main>

    <footer class="fixed bottom-0 w-full bg-white border-t flex justify-around p-3 shadow-2xl">
        <button onclick="switchView('scan')" class="flex flex-col items-center text-blue-600"><span>📷</span><span class="text-[10px]">Scanner</span></button>
        <button onclick="switchView('list')" class="flex flex-col items-center text-gray-400"><span>📋</span><span class="text-[10px]">Lista</span></button>
    </footer>

    <script>
        const categories = [
            { n: 'Lácteos', d: 15, e: '🥛' }, { n: 'Pan', d: 5, e: '🍞' }, { n: 'Carne', d: 3, e: '🥩' },
            { n: 'Fruta', d: 4, e: '🍎' }, { n: 'Bebida', d: 30, e: '🥤' }, { n: 'Almacén', d: 180, e: '🥫' }
        ];

        let database = JSON.parse(localStorage.getItem('vp_db')) || [];
        let memory = JSON.parse(localStorage.getItem('vp_memory')) || {};
        let selectedCatIndex = null;

        // Iniciar Lógica
        window.onload = () => {
            renderCategories();
            startScanner();
        };

        function startScanner() {
            const codeReader = new ZXing.BrowserMultiFormatReader();
            codeReader.decodeFromVideoDevice(null, 'video', (result) => {
                if (result) {
                    const code = result.text;
                    document.getElementById('barcode-input').value = code;
                    if (memory[code]) {
                        document.getElementById('product-name').value = memory[code].name;
                        selectCategory(memory[code].catIndex);
                    }
                }
            });
        }

        function renderCategories() {
            const grid = document.getElementById('categories-grid');
            grid.innerHTML = "";
            categories.forEach((cat, i) => {
                grid.innerHTML += `<div id="cat-${i}" onclick="selectCategory(${i})" class="bg-gray-50 p-2 rounded-lg text-center border-2 border-transparent cursor-pointer">
                    <div class="text-xl">${cat.e}</div><div class="text-[10px]">${cat.n}</div>
                </div>`;
            });
        }

        function selectCategory(index) {
            selectedCatIndex = index;
            document.querySelectorAll('#categories-grid div').forEach(el => el.classList.remove('selected-cat'));
            document.getElementById(`cat-${index}`).classList.add('selected-cat');
            const dateInput = document.getElementById('expiry-date');
            const d = new Date();
            d.setDate(d.getDate() + categories[index].d);
            dateInput.value = d.toISOString().split('T')[0];
        }

        function saveProduct() {
            const name = document.getElementById('product-name').value;
            const code = document.getElementById('barcode-input').value;
            const date = document.getElementById('expiry-date').value;
            if (!name || !date || !code) return alert("Faltan datos");
            
            database.push({ name, code, date, catIndex: selectedCatIndex });
            memory[code] = { name, catIndex: selectedCatIndex };
            
            localStorage.setItem('vp_db', JSON.stringify(database));
            localStorage.setItem('vp_memory', JSON.stringify(memory));
            alert("¡Guardado!");
            location.reload();
        }

        function switchView(view) {
            document.getElementById('view-scan').style.display = view === 'scan' ? 'block' : 'none';
            document.getElementById('view-list').style.display = view === 'list' ? 'block' : 'none';
            if(view === 'list') renderList();
        }

        function renderList() {
            const container = document.getElementById('inventory-list');
            container.innerHTML = database.length ? "" : "<p class='text-center text-gray-400 pt-10'>No hay productos</p>";
            database.sort((a,b) => new Date(a.date) - new Date(b.date)).forEach(item => {
                const diff = Math.ceil((new Date(item.date) - new Date()) / (86400000));
                container.innerHTML += `<div class="bg-white p-4 rounded-xl shadow-sm flex justify-between ${diff <= 2 ? 'status-red' : (diff <= 7 ? 'status-yellow' : '')}">
                    <div><div class="font-bold">${item.name}</div><div class="text-xs text-gray-400">${item.code}</div></div>
                    <div class="text-right"><div class="text-sm font-bold">${diff} días</div><div class="text-[10px] text-gray-400">${item.date}</div></div>
                </div>`;
            });
        }

        function shareWhatsApp() {
            let msg = "🔥 ¡OFERTAS DE HOY!:\n";
            database.filter(i => (new Date(i.date)-new Date())/86400000 <= 7).forEach(i => msg += `• ${i.name}\n`);
            window.open(`https://wa.me{encodeURIComponent(msg)}`);
        }
    </script>
</body>
</html>
